name: CI
on: [push, pull_request]

jobs:
  ellenorzes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Van-e cím az oldalon?
        run: grep -q "<title>" index.html

      - name: HTML szintaxis ellenőrzése
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy
          tidy -errors -quiet index.html
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Docker image építése
        run: docker build -t cicd-gyakorlas .

      - name: Konténer kipróbálása
        run: |
          docker run -d -p 8080:80 --name teszt cicd-gyakorlas
          sleep 3
          curl --fail http://localhost:8080          