name: Publish
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Bejelentkezés a GHCR-be
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Image építése
        run: |
          docker build \
            -t ghcr.io/csaszi555/cicd-gyakorlas:latest \
            -t ghcr.io/csaszi555/cicd-gyakorlas:${{ github.sha }} .

      - name: Image feltöltése
        run: |
          docker push ghcr.io/csaszi555/cicd-gyakorlas:latest
          docker push ghcr.io/csaszi555/cicd-gyakorlas:${{ github.sha }}